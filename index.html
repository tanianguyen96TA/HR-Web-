<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - Supabase version</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-box {
            max-width: 500px;
            margin: 50px auto;
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .role-btn {
            display: block;
            width: 100%;
            margin-bottom: 15px;
            padding: 15px;
            font-size: 16px;
            text-decoration: none;
            color: white;
            border-radius: 4px;
            background-color: #3498db;
        }
        .role-btn.hr {
            background-color: #2ecc71;
        }
        .alert {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="header">
        <div><strong>HRMS</strong> - Connected to Supabase</div>
    </div>

    <div class="login-box">
        <div class="alert">
            <strong>Chú ý:</strong> Ứng dụng này đang sử dụng Database từ Supabase. Bạn phải điền <code>SUPABASE_URL</code> và <code>SUPABASE_ANON_KEY</code> vào file <code>app.js</code> thì mới hoạt động được!
        </div>

        <h2>Chọn vai trò để Test</h2>
        
        <a href="employee.html" class="role-btn">Đăng nhập với tư cách: Nhân viên (Employee)</a>
        <a href="hr.html" class="role-btn hr">Đăng nhập với tư cách: Nhân sự (HR Admin)</a>
    </div>
</body>
</html>
